
services:
  backend:
    build: ./backend
    container_name: monkey-lift-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/monkey_lift.db:/app/monkey_lift.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: monkey-lift-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
